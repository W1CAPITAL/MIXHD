name: Build Naruto AIR ARM64 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup AIR SDK 51.3.4.3
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: '51.3.4.3'
          accept-license: true

      - name: Verify Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $androidJar = Join-Path $env:ANDROID_HOME 'platforms\android-35\android.jar'
          if (!(Test-Path $androidJar)) { throw "android-35/android.jar not found" }
          Write-Host "AIR_HOME=$env:AIR_HOME"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"

      - name: Build ANE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\classes,build\native,build\ext | Out-Null

          compc '-source-path=ane-as/src' '-include-classes=br.davi.narutoair.portal.PortalMarker' '-output=build/portal.swc'
          if ($LASTEXITCODE -ne 0) { throw "compc failed" }

          $fre = Join-Path $env:AIR_HOME 'lib\android\FlashRuntimeExtensions.jar'
          $androidJar = Join-Path $env:ANDROID_HOME 'platforms\android-35\android.jar'
          $javaFiles = Get-ChildItem -Recurse ane-java\src -Filter *.java | ForEach-Object { $_.FullName }
          javac -source 8 -target 8 -cp "$fre;$androidJar" -d build\classes $javaFiles
          if ($LASTEXITCODE -ne 0) { throw "javac failed" }
          jar cf build\native\portal.jar -C build\classes .
          if ($LASTEXITCODE -ne 0) { throw "jar failed" }

          Push-Location build\native
          jar xf ..\portal.swc library.swf
          Pop-Location
          if (!(Test-Path build\native\library.swf)) { throw "library.swf missing" }

          adt -package -target ane build\ext\portal.ane extension.xml -swc build\portal.swc `
            -platform Android-ARM -C build\native portal.jar library.swf `
            -platform Android-ARM64 -C build\native portal.jar library.swf
          if ($LASTEXITCODE -ne 0) { throw "ANE packaging failed" }
          jar tf build\ext\portal.ane

      - name: Compile AIR application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mxmlc '-source-path=src' '-output=build/NarutoAir.swf' src/NarutoAir.as
          if ($LASTEXITCODE -ne 0) { throw "mxmlc failed" }

      - name: Create signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          adt -certificate -cn 'Naruto AIR Experimental' 2048-RSA build\cert.p12 narutoair
          if ($LASTEXITCODE -ne 0) { throw "certificate creation failed" }

      - name: Package captive ARM64 APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          adt -package -target apk-captive-runtime -arch armv8 `
            -storetype pkcs12 -keystore build\cert.p12 -storepass narutoair `
            build\NarutoOnline_AIR_ARM64_0.4.0_EXPERIMENTAL.apk `
            NarutoAir-app.xml `
            -platformsdk $env:ANDROID_HOME `
            -C build NarutoAir.swf `
            -extdir build\ext
          if ($LASTEXITCODE -ne 0) { throw "APK packaging failed" }

          $apk = 'build\NarutoOnline_AIR_ARM64_0.4.0_EXPERIMENTAL.apk'
          if (!(Test-Path $apk)) { throw "APK missing" }
          Get-Item $apk | Format-List Name,Length,FullName
          $entries = jar tf $apk
          $arm64 = $entries | Select-String 'lib/arm64-v8a/'
          if (!$arm64) { throw "APK does not contain arm64-v8a libraries" }
          $arm64 | Select-Object -First 20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarutoOnline_AIR_ARM64_0.4.0_EXPERIMENTAL
          path: build/NarutoOnline_AIR_ARM64_0.4.0_EXPERIMENTAL.apk
          if-no-files-found: error
